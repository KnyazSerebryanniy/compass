<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Политический компас 2D</title>
<style>
  body {
    margin: 0;
    background: #EDE6D6;
    font-family: Georgia, "Times New Roman", serif;
    color: #2B2620;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 0;
  }
  .layout {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .wrap {
    position: relative;
    width: 720px;
    flex-shrink: 0;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }
  .axis-label {
    font-family: Georgia, serif;
    font-size: 15px;
    fill: #2B2620;
  }
  .pole-label {
    font-family: Georgia, serif;
    font-size: 13px;
    fill: #6b5f4e;
    letter-spacing: 0.5px;
  }
  #infoPanel {
    width: 280px;
    min-height: 200px;
    background: #e2d9c4;
    border: 1px solid #8B3A2F;
    border-radius: 14px;
    padding: 18px 20px;
    display: none;
    box-sizing: border-box;
  }
  #infoPanel h3 {
    margin: 0 0 10px;
    font-size: 17px;
    color: #8B3A2F;
    border-bottom: 1px solid #B08D57;
    padding-bottom: 8px;
  }
  #infoPanel p {
    white-space: pre-line;
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
  }
  #infoPanel .closeBtn {
    float: right;
    cursor: pointer;
    color: #8B3A2F;
    font-size: 22px;
    line-height: 1;
    border: none;
    background: none;
    font-family: Georgia, serif;
    padding: 0;
  }
  #settingsBtn, #closeAllBtn {
    position: fixed;
    top: 16px;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid #8B3A2F;
    background: #e2d9c4;
    color: #8B3A2F;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    font-family: Georgia, serif;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #settingsBtn { left: 16px; }
  #closeAllBtn { right: 16px; font-size: 20px; }
  #layerToggle {
    position: fixed;
    top: 16px;
    left: 60px;
    height: 36px;
    box-sizing: border-box;
    display: flex;
    background: #e2d9c4;
    border: 1px solid #8B3A2F;
    border-radius: 8px;
    overflow: hidden;
    font-family: Georgia, serif;
    font-size: 12px;
    z-index: 50;
  }
  #layerToggle .tgl-btn {
    border: none;
    cursor: pointer;
    padding: 0 14px;
    height: 100%;
    position: relative;
    z-index: 1;
    background: transparent;
    color: #2B2620;
    transition: color .3s ease;
  }
  #layerToggle .tgl-btn.active { color: #EDE6D6; }
  #tglPill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 0;
    background: #8B3A2F;
    z-index: 0;
  }
  #tglPill.ready {
    transition: transform .38s cubic-bezier(.4, 0, .2, 1), width .38s cubic-bezier(.4, 0, .2, 1);
  }
  #points { transition: opacity .2s ease; }
  #points circle.pt {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform .4s cubic-bezier(.2, .8, .2, 1);
  }
  @keyframes lblIn {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #points .lbl.lbl-in {
    animation: lblIn .24s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes ovIn   { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ovOut  { from { opacity: 1; } to { opacity: 0; } }
  @keyframes panelIn  {
    from { opacity: 0; transform: translateY(12px) scale(.95); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes panelOut {
    from { opacity: 1; transform: none; }
    to   { opacity: 0; transform: translateY(8px) scale(.97); }
  }
  #settingsOverlay.open { animation: ovIn .24s ease both; }
  #settingsOverlay.open #settingsPanel { animation: panelIn .3s cubic-bezier(.2, .8, .2, 1) both; }
  #settingsOverlay.closing { animation: ovOut .18s ease both; }
  #settingsOverlay.closing #settingsPanel { animation: panelOut .18s ease both; }
  #settingsOverlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(43, 38, 32, 0.25);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #settingsPanel {
    background: #e2d9c4;
    border: 1px solid #8B3A2F;
    border-radius: 14px;
    padding: 20px 24px;
    width: 300px;
    box-sizing: border-box;
    box-shadow: 0 8px 28px rgba(43,38,32,0.3);
  }
  #settingsPanel h3 {
    margin: 0 0 16px;
    font-size: 17px;
    color: #8B3A2F;
    border-bottom: 1px solid #B08D57;
    padding-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #settingsPanel .closeBtn {
    cursor: pointer;
    color: #8B3A2F;
    font-size: 22px;
    line-height: 1;
    border: none;
    background: none;
    font-family: Georgia, serif;
    padding: 0;
  }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 14px;
  }
  #searchWrap {
    position: relative;
    width: 400px;
    margin: 0 auto 10px;
  }
  #searchInput {
    width: 100%;
    box-sizing: border-box;
    padding: 9px 16px;
    border: 1px solid #8B3A2F;
    border-radius: 20px;
    background: #e2d9c4;
    color: #2B2620;
    font-family: Georgia, serif;
    font-size: 14px;
    outline: none;
  }
  #searchInput::placeholder {
    color: #6b5f4e;
  }
  #searchResults {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    margin-top: 6px;
    background: #e2d9c4;
    border: 1px solid #8B3A2F;
    border-radius: 12px;
    max-height: 240px;
    overflow-y: auto;
    z-index: 40;
    box-shadow: 0 6px 18px rgba(43,38,32,0.25);
  }
  #searchResults .res-item {
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  #searchResults .res-item:hover {
    background: #d8cbac;
  }
  #searchResults .res-empty {
    padding: 8px 16px;
    font-size: 13px;
    color: #6b5f4e;
  }

  /* ===== Адаптация под узкие экраны ===== */
  html { -webkit-text-size-adjust: 100%; }
  svg { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  @media (max-width: 1040px) {
    body {
      align-items: flex-start;
      padding: 64px 0 24px;
    }
    .layout {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      width: 100%;
    }
    .wrap {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      flex-shrink: 1;
    }
    #infoPanel {
      width: calc(100% - 24px);
      min-height: 0;
      max-width: 720px;
      margin: 0 auto;
      align-self: center;
    }
    #searchWrap {
      width: calc(100% - 32px);
      max-width: 400px;
      margin: 0 auto 6px;
    }
    #settingsPanel { width: min(300px, calc(100vw - 32px)); }
  }
  @media (max-width: 700px) {
    #searchWrap { width: auto; margin: 0 12px 12px; max-width: none; }
    #searchInput { font-size: 16px; }
    .axis-label { font-size: 24px; }
    #points circle.pt { r: 5.5px; }
    #points .lbl text { font-size: 18px; }
    #infoPanel { width: calc(100% - 20px); margin: 0 auto; padding: 14px 16px; }
    #infoPanel h3 { font-size: 16px; }
    #infoPanel p { font-size: 15px; }
    #layerToggle .tgl-btn { padding: 0 11px; }
  }

  /* ===== Пресеты ===== */
  #presetBtn {
    position: fixed; left: 16px; bottom: 16px; height: 36px; padding: 0 14px;
    box-sizing: border-box; border: 1px solid #8B3A2F; border-radius: 8px;
    background: #e2d9c4; color: #8B3A2F; font-family: Georgia, serif; font-size: 13px;
    cursor: pointer; z-index: 50; display: flex; align-items: center; gap: 6px;
  }
  #presetMenu {
    position: fixed; left: 16px; bottom: 60px; min-width: 200px; max-width: calc(100vw - 32px);
    background: #e2d9c4; border: 1px solid #8B3A2F; border-radius: 12px; padding: 6px;
    box-shadow: 0 6px 18px rgba(43,38,32,0.25); z-index: 60; display: block;
    font-family: Georgia, serif; font-size: 14px;
    max-height: 140px; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    opacity: 0; visibility: hidden; pointer-events: none;
    transform: translateY(10px) scale(.96); transform-origin: left bottom;
    transition: opacity .22s ease, transform .26s cubic-bezier(.2,.8,.2,1), visibility 0s linear .26s;
  }
  #presetMenu.open {
    opacity: 1; visibility: visible; pointer-events: auto; transform: none;
    transition: opacity .22s ease, transform .26s cubic-bezier(.2,.8,.2,1), visibility 0s;
  }
  #presetMenu .pr-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-radius: 8px; cursor: pointer; color: #2B2620;
    transition: background .25s ease, color .25s ease;
  }
  #presetMenu .pr-item:hover { background: #d8cbac; }
  #presetMenu .pr-item.active { background: #8B3A2F; color: #EDE6D6; }
  #presetMenu .pr-flag {
    width: 30px; height: 20px; border-radius: 2px; background: #b8ab90;
    border: 1px solid rgba(43,38,32,0.35); box-sizing: border-box; flex-shrink: 0;
  }
</style>
</head>
<body>
<button id="settingsBtn" onclick="openSettings()" title="Настройки (Esc)">⚙</button>
<div id="layerToggle">
  <div id="tglPill"></div>
  <button onclick="setLayer('ideo')" id="btn-ideo" title="Переключить слой (Ctrl)" class="tgl-btn active">Идеологии</button>
  <button onclick="setLayer('real')" id="btn-real" title="Переключить слой (Ctrl)" class="tgl-btn" style="border-left:1px solid #8B3A2F;">Партии</button>
</div>
<button id="presetBtn" onclick="togglePresetMenu(event)" title="Пресеты (Ё)">☰ Пресеты</button>
<div id="presetMenu"></div>
<button id="closeAllBtn" onclick="closeAll()" title="Закрыть все открытые точки (Shift)">×</button>

<div id="settingsOverlay" onclick="if(event.target===this) closeSettings();">
  <div id="settingsPanel">
    <h3>Настройки<button class="closeBtn" onclick="closeSettings()">×</button></h3>
    <div class="settings-row">
      <span>Показывать окно с пояснением</span>
      <div id="infoSwitch" onclick="toggleInfoEnabled()" style="width:44px; height:24px; border-radius:12px; border:1px solid #8B3A2F; background:#8B3A2F; position:relative; cursor:pointer; flex-shrink:0; transition:background .25s ease;">
        <div id="infoKnob" style="width:18px; height:18px; border-radius:50%; background:#EDE6D6; position:absolute; top:2px; left:23px; transition:left .25s cubic-bezier(.4,0,.2,1);"></div>
      </div>
    </div>
    <div class="settings-row">
      <span>«Пасхальное яйцо»</span>
      <div id="eggSwitch" onclick="toggleEgg()" style="width:44px; height:24px; border-radius:12px; border:1px solid #8B3A2F; background:#b8ab90; position:relative; cursor:pointer; flex-shrink:0; transition:background .25s ease;">
        <div id="eggKnob" style="width:18px; height:18px; border-radius:50%; background:#EDE6D6; position:absolute; top:2px; left:3px; transition:left .25s cubic-bezier(.4,0,.2,1);"></div>
      </div>
    </div>
  </div>
</div>

<div class="layout">
  <div class="wrap">
    <div id="searchWrap">
      <input id="searchInput" type="text" placeholder="Поиск... (Tab)" oninput="onSearchInput()" onfocus="onSearchInput()">
      <div id="searchResults"></div>
    </div>
    <svg id="compass" viewBox="0 0 720 760" xmlns="http://www.w3.org/2000/svg">

      <rect x="0" y="0" width="720" height="760" fill="#EDE6D6"/>

      <rect x="80" y="80" width="560" height="560" fill="none" stroke="#8B3A2F" stroke-width="1.5"/>

      <g stroke="#8B3A2F" stroke-width="0.35" opacity="0.45">
        <line x1="150" y1="80" x2="150" y2="640"/>
        <line x1="220" y1="80" x2="220" y2="640"/>
        <line x1="290" y1="80" x2="290" y2="640"/>
        <line x1="430" y1="80" x2="430" y2="640"/>
        <line x1="500" y1="80" x2="500" y2="640"/>
        <line x1="570" y1="80" x2="570" y2="640"/>
        <line x1="80" y1="150" x2="640" y2="150"/>
        <line x1="80" y1="220" x2="640" y2="220"/>
        <line x1="80" y1="290" x2="640" y2="290"/>
        <line x1="80" y1="430" x2="640" y2="430"/>
        <line x1="80" y1="500" x2="640" y2="500"/>
        <line x1="80" y1="570" x2="640" y2="570"/>
      </g>

      <line x1="80" y1="360" x2="640" y2="360" stroke="#2B2620" stroke-width="0.75"/>
      <line x1="360" y1="80" x2="360" y2="640" stroke="#2B2620" stroke-width="0.75"/>

      <text class="axis-label" x="360" y="50" text-anchor="middle" font-weight="bold">Государственничество</text>
      <text class="axis-label" x="360" y="700" text-anchor="middle" font-weight="bold">Невмешательство</text>

      <text class="axis-label" x="55" y="360" text-anchor="middle" dominant-baseline="middle" font-weight="bold" transform="rotate(-90 55 360)">Левая риторика</text>
      <text class="axis-label" x="665" y="360" text-anchor="middle" dominant-baseline="middle" font-weight="bold" transform="rotate(90 665 360)">Правая риторика</text>

      <g id="points"></g>

    </svg>
  </div>

  <div id="infoPanel">
    <button class="closeBtn" onclick="closeInfo()">×</button>
    <h3 id="infoTitle"></h3>
    <p id="infoDesc"></p>
  </div>
</div>

<script>
  var layers = {
    egg_ideo: [
      ["Савинковизм", 2, -16, "Идеология из вселенной Kaiserreich: эклектичный синтез левого и правого вокруг фигуры Бориса Савинкова. Аграрно-социалистическое неонародничество, земельная реформа и разрушение старых элит сочетаются с этнонационализмом, молодёжными военизированными формированиями, опорой на традиционные религии и революционным христианством. Главное — полная преданность Вождю.\n\nОтносится к идеологии: национал-популизм.", "Савинковизм"],
      ["Елизаровщина", 4, -18, "Идеология из сабмода «Эра лжепатриотизма»: красно-коричневый синтез сталинизма (ресталинизация, «Советская вера»), православия (влияние церкви, православные коммуны), имперской идеи («Реставрация Империщины») и русского мистицизма под знаком бастиона антилиберализма; культ вождя и культурная война против «чуждой» интеллигенции.\n\nОтносится к идеологии: либертарный социализм.", "Елизаровщина"],
      ["Байденизм", -3, -17, "Идеология из мода TFR. Демократия объявлена краеугольным камнем нации, а Джозеф Байден — символом американского духа: несмотря на преклонный возраст, его ум остаётся «острым», и он «неустанно» борется за её дело. По этой идее чистота демократии под угрозой даже после исчезновения главного врага, поэтому президент обещает искоренить любые «зловещие и реакционные» элементы, «очистить» демократическую миссию Америки и сделать мир вечным состоянием страны — даже ценой жертв и мучеников среди свободных граждан.\n\nОтносится к идеологии: деспотизм.", "Байденизм"],
      ["Трампизм", 12, -17, "Идеология из мода TFR. Американский народ когда-то имел «Мессию» — магната недвижимости в красном галстуке, который привёл нацию к беспрецедентным высотам, но был предан и перехитрен «глобалистской кликой» и заговорщиками из истеблишмента. Сегодня страну разрушает «стареющий и некомпетентный тиран», пытающийся уничтожить наследие вождя. Видение лидера продолжает жить под руководством его сына Баррона Трампа, а наследие будет передаваться из поколения в поколение — до окончательного свержения Джо Байдена и его сил.\n\nОтносится к идеологии: деспотизм.", "Трампизм"],
      ["Русское возрожденчество", 18, -15, "Идеология одного из осколков России в проекте TFR: Shattered Motherland.\n\nРусская нация потерпела страшное поражение от сил глобалистов и евробюрократов. Измученное, окровавленное тело России теперь испещрено язвами — полевые командиры, марионетки Запада, советчина и прочие враги русского народа.\n\nНо русский народ не погиб и не пал духом. Правительство Национального Спасения, возникшее в районах Южного Поволжья, руководимое героем русского движения — Романом Юнеманом, является оплотом русскости и национальной неколебимости. Роман Александрович стремится вновь сплотить Родину, осуществить русское возрождение для самой главной цели — мести, страшной и беспощадной.\n\nОтносится к идеологии: фашизм.", "Русское возрожденчество"],
      ["Эсеровщина", -15, -2, "Идеология одного из осколков России в проекте TFR: Shattered Motherland.\n\nНаша Родина потерпела крах в борьбе с леволиберальными элитами Европы. Эти левые — предатели социалистической морали и классовой борьбы, слившиеся с либеральной технократией Брюсселя.\n\nНо в России нашёлся герой левой борьбы, готовый бороться за социалистическое дело. Николай Николаевич Бондаренко — видный левый политик своего родного Саратова, совершивший революцию в период новой Русской смуты и установивший в верховьях Волги советскую власть. Но, в отличие от фанатиков Сталина и любителей советского пломбира, Бондаренко — примерный русский социалист.\n\nНаследуя русскую социалистическую традицию Герцена, новые эсеры — социалисты, стремящиеся к построению общества равенства и справедливости путём перехода к кооперативной системе собственности во всевозможных отраслях экономики, особенно в сельском хозяйстве, для достижения истинного равенства, как во времена крестьянских общин Российской империи.\n\nОтносится к идеологии: либертарный социализм.", "Эсеровщина"]
    ],
    egg_real: [
      ["Яблоко (НД)", 7, 4, "Национал-демократическое крыло «Яблока»: либеральная рамка (правовое государство, выборы, свободы) в сочетании с этнонациональной повесткой — ограничение миграции, «русский вопрос». Связывается с линией молодого Навального в «Яблоке» до исключения в 2007 году.", "Яблоко (Национал-демократы)"]
    ],
    ideo: [
      ["Центризм", 0, 0, ""],
      ["Анархо-коммунизм", -20, 20, ""],
      ["Классический либерализм", 0, 9, ""],
      ["Ордолиберализм", 0, 2, ""],
      ["Неолиберализм", 0, 4, ""],
      ["Социал-либерализм", -4, -2, ""],
      ["Прогрессивный либерализм", -9, -3, ""],
      ["Консервативный либерализм", 4, 3, ""],
      ["Национал-либерализм", 7, 1, ""],
      ["Либеральный консерватизм", 8, 0, ""],
      ["Неоконсерватизм", 11, -5, ""],
      ["Национал-демократия", 12, -3, ""],
      ["Национал-консерватизм", 15, -10, ""],
      ["Социал-консерватизм", 5, -8, ""],
      ["Красный консерватизм", -1, -14, ""],
      ["Красный торизм", 3, -3, ""],
      ["Синий торизм", 8, 2, ""],
      ["Христианский консерватизм", 7, -6, ""],

    real: [
      ["Единая Россия", 4, -14, "Партия власти, объединяющая консенсус вокруг действующей вертикали — риторически эклектична (традиционные ценности, патриотизм, державность), на практике опирается на исполнительную власть и максимальный госконтроль над экономикой и политическим полем."],
      ["Справедливая Россия", -3, -11, "Формально левоцентристская, социал-демократическая по программе (соцгарантии, прогрессивное налогообложение), но системная лояльная оппозиция, встроенная в ту же вертикаль, что и партия власти; после слияния с партией Прилепина добавила патриотическо-милитаристскую риторику."],
      ["КПРФ", -9, -13, "Наследник советской компартии, давно не революционная, а системная парламентская оппозиция: марксистско-ленинская риторика в сочетании с державным патриотизмом и ностальгией по СССР, встроена в общую вертикаль.", "Коммунистическая партия Российской Федерации"],
      ["Коммунисты России", -14, -15, "Более ортодоксальная и радикальная коммунистическая партия, чем КПРФ: делает упор на классовую логику и марксистско-ленинскую линию, жёстче критикует олигархат и реже использует державную и церковную риторику; парламентская, но не революционная."],
      ["ЛДПР", 11, -11, "После смерти Жириновского сохраняет во многом его наследие — национал-популистская, державная риторика, жёсткий патриотизм, часто с провокационной подачей; экономически эклектична, но неизменно в фарватере системной лояльности.", "Либерально-демократическая партия России"],
      ["Родина", 9, -13, "Российская национал-патриотическая партия — державный национализм, милитаризм, поддержка традиционных ценностей, экономически временами левопопулистская (защита отечественного производителя), системно лояльна."],
      ["Новые люди", 3, 3, "Новая партия (с 2020), позиционируется как либеральная альтернатива системной оппозиции — за малый и средний бизнес, дерегуляцию, технологическое развитие, избегая острых политических тем и оставаясь в рамках системной лояльности."],
      ["Яблоко", -5, 6, "Старейшая российская либеральная партия: классический либерализм в правах (свобода слова, честные выборы, права человека), умеренно левая в экономике (соцзащита без социализма), последовательно оппозиционная, не встроена в системную вертикаль."],
      ["Зелёные", -2, -3, "Российская экологическая партия — немногочисленная, не оказывает заметного влияния: экологическая повестка (защита окружающей среды, экопросвещение) без выраженной классовой программы, деполитизирована по сравнению с западными зелёными, лояльна системе."],
      ["Партия прямой демократии", 0, 1, "Процедурная партия: ядро программы — электронная демократия, цифровизация голосования и референдумов, принцип «избиратель знает лучше»; экономическая и социальная позиция почти не выражена, сотрудничает с властью и разработчиками системы дистанционного электронного голосования."],
      ["Союз правых сил", 2, 7, "Главная рыночно-либеральная партия 1999–2008 годов (Чубайс, Немцов, Хакамада, Белых): приватизация, низкие налоги, профессиональная армия, интеграция с Западом; технократический реформизм с опорой на сильную исполнительную власть как инструмент реформ."],
      ["ПАРНАС", 0, 7, "Либерально-демократическая оппозиционная партия: свободные выборы, борьба с коррупцией, права человека, федерализм, рыночная экономика с умеренной социальной защитой и европейская ориентация; сильнее СПС делает упор на институтах и подотчётности власти.", "Партия народной свободы"],
      ["Наш дом — Россия", 1, -6, "Первая «партия власти» 1990-х (1995–2006) вокруг Черномырдина: прагматичный центризм хозяйственных руководителей — стабильность, умеренное продолжение рыночных реформ, поддержка промышленных и сырьевых лобби, лояльность президенту."],
      ["Отечество — Вся Россия", -1, -11, "Блок региональных элит вокруг Лужкова и Примакова (1999–2001): сильное государство, социальные гарантии, поддержка отечественной промышленности, державность и «евразийская» внешняя политика, критика радикальных рыночных реформ 1990-х."],
      ["ХДДР", 6, -3, "Христианско-демократическое движение начала 1990-х: православно-консервативная христианская демократия — антикоммунизм, частная собственность, демократические институты, опора на христианские ценности и национальную традицию без секулярного западного либерализма.", "Христианско-демократическое движение России"],
      ["Трудовая Россия", -16, -17, "Радикально-левое движение (Анпилов): возврат к Советскому Союзу, жёсткая классовая риторика, уличный протест, ностальгия по сталинскому государству; непримиримее парламентской КПРФ."],
      ["НРПР", 15, -12, "Национально-республиканская партия России (Николай Лысенко, 1990-е): русский национализм как главная идея, антиельцинская оппозиция, сильное государство и возрождение «национальной» России при формально республиканской форме правления.", "Национально-республиканская партия России"],
      ["НБП", 0, -15, "Национал-большевистская партия (Лимонов): радикальный синтез имперского национализма и антикапиталистической, антиолигархической риторики с провокационной эстетикой и уличным действием; идеал государственнический, практика — антисистемная оппозиция.", "Национал-большевистская партия"],
      ["КРО", 10, -10, "Конгресс русских общин (Рогозин, Скоков, при поддержке Лебедя): национально-патриотический блок начала 1990-х — защита русских в «ближнем зарубежье», державность, сильное государство, поддержка отечественной промышленности и протекционизм; более умеренный и «респектабельный» национализм, чем у радикалов.", "Конгресс русских общин"],
      ["Монархическая партия России", 16, -9, "Партия Антона Бакова (2012): восстановление монархии и династии Романовых, православная традиция, иерархия и историческая преемственность; скорее консервативно-реставрационная и символическая, чем революционная."],
      ["Евразия", 14, -15, "Партия Дугина (2001–2002): политическая оболочка неоевразийства, ориентированная на поддержку Путина — имперская геополитика («Суша против Моря»), традиционализм, отказ от либерализма и атлантизма, «большое пространство» вокруг России; лояльная, а не оппозиционная.", "Партия «Евразия»"],
      ["РОС", 5, -13, "Российский общенародный союз Сергея Бабурина: «общенародное государство», защита суверенитета и территориальной целостности, критика приватизации, государственная собственность на природные ресурсы, социальная защита, державность и антизападная позиция.", "Российский общенародный союз"],
      ["Общество.Будущее", 8, -4, "Национал-демократическое движение Романа Юнемана (с 2020): правоцентристское, с акцентом на «защиту русских» и антимигрантской повесткой, но в демократической рамке — участие в выборах, собственный проект Конституции; вторжение в Украину осудило."],
      ["Рассвет", -2, 7, "Партия Екатерины Дунцовой (проходит регистрацию): свободная конкурентная экономика с государственной соцподдержкой, децентрализация и прямые выборы мэров и губернаторов, светское государство, права человека и независимые СМИ, мирная дипломатия и профессиональная армия."],
      ["ЛПР", 0, 16, "ЛПР — либертарианская партия (с 2008): минимальное государство, низкие налоги, свободный рынок, свобода слова и гражданские свободы. В 2020 году разделилась на две организации с одним названием (партия Светова и партия Бойко, позже Карнавского); первая прекратила деятельность в 2026 году после признания «иноагентом», вторая продолжает работу.", "Либертарианская партия России"],
      ["Память", 18, -14, "Радикально-националистическое движение позднесоветского и раннепостсоветского времени (Д. Васильев): русский этнонационализм с православно-монархической окраской, антилиберализм и антикоммунизм, конспирология, идеал «русского порядка».", "Национально-патриотический фронт «Память»"],
      ["АПР", -4, -8, "Отраслевая партия аграриев (М. Лапшин): государственные субсидии и протекционизм для села, поддержка колхозов и аграрного лобби — левое экономическое содержание с почвенно-консервативной риторикой; лоббизм ресурсов, а не идеология всеобщего огосударствления.", "Аграрная партия России"],
      ["ХДС(Н)", 3, -3, "Центристско-консервативная «народная партия» Германии: христианско-демократические корни, социальная рыночная экономика, умеренный консерватизм и сдержанный патриотизм, развитое государство всеобщего благосостояния без радикального вмешательства. Буква (Н) в подписи означает «нынешняя», в отличие от ХДС(Б) боннской эпохи.", "Христианско-демократический союз"],
      ["ХСС", 8, -6, "Баварская сестринская партия ХДС: католический консерватизм и баварская идентичность, жёсткая линия по миграции, культурный традиционализм («Leitkultur»), социальное государство и активная роль государства в региональной политике.", "Христианско-социальный союз"],
      ["СвДП", 0, 9, "Классическая либеральная партия Германии: экономическая свобода, низкие налоги, дерегуляция, гражданские свободы, цифровизация; социально либеральна и светская, при этом принимает сильное государство в вопросах безопасности и права.", "Свободная демократическая партия"],
      ["Свободные избиратели", 4, 1, "Движение общинных и региональных избирателей (сильнее всего в Баварии): прагматичный центр-право, антибюрократизм, субсидиарность, интересы села и малого бизнеса, умеренно популистская риторика, культурный консерватизм без жёсткого национализма.", "Свободные избиратели"],
      ["СДПГ(Н)", -6, -5, "Классическая центр-левая партия Германии: развитое социальное государство, профсоюзы, умеренное перераспределение, интернационализм в рамках ЕС и светский прогрессивизм; левоцентристский прагматизм управленческой партии консенсуса. Буква (Н) в подписи означает «нынешняя»; есть также СДПГ(Б) боннской эпохи и СДПГ(С) «старая» до 1933 года.", "Социал-демократическая партия Германии"],
      ["Левые", -14, -9, "Германская партия демократического социализма: антикапитализм, национализация ключевых отраслей, потолок аренды, высокие налоги на богатых, пацифизм и интернационализм при либертарной культурной линии; наследница ПДС, в 2024 году от партии откололся BSW.", "Левые"],
      ["Союз 90/Зелёные", -8, -4, "Немецкая партия экологизма и социального либерализма: климатическая политика с жёстким регулированием, права меньшинств, проевропейский интернационализм, защита гражданских свобод и открытость к миграции; опора на образованный городской средний класс.", "Союз 90/Зелёные"],
      ["АдГ", 15, -7, "Национал-консервативная, по ряду течений ультраправая партия Германии: жёсткая линия по миграции, этнокультурная идея «немецкого народа», евроскептицизм, традиционная семья; экономически неоднородна — рыночное крыло и «социальное государство для своих».", "Альтернатива для Германии"],
      ["Вольт", -6, 0, "Паневропейская прогрессивно-либеральная партия: федеральная Европа, цифровизация, «доказательная политика», социальный либерализм, защита климата и прав меньшинств; технократический прагматизм, позиционирование «вне левого и правого».", "Вольт"],
      ["BSW", 0, -9, "Партия-раскольник от «Левых» (2024): левоконсервативный синтез — социальное государство, защита пенсий и зарплат, пацифизм и «мирная с Россией» линия, ограничение миграции, критика «woke»-повестки и климатического регулирования.", "Союз Сары Вагенкнехт"],
      ["Die Heimat", 17, -17, "Переименованная в 2023 году НДПГ, старейшая ультраправая партия Германии: этнический национализм и идея «народного сообщества», ксенофобия, антикапиталистическая «национал-социалистическая» риторика, недоверие к демократическому порядку; электорально маргинальна, идеологически радикальна.", "Die Heimat"],
      ["Баварская партия", 9, 1, "Консервативная, католическая, региональная и автономистская партия: баварская идентичность, федерализм до сепаратизма («Freistaat»), защита села и традиций, критика централизма Берлина и Брюсселя, поддержка малого и среднего бизнеса; монархические корни.", "Баварская партия"],
      ["НЛП", 7, 3, "Партия немецкой буржуазии эпохи Бисмарка (1867–1918): национальное единство и империя, рыночная экономика и право собственности, светское государство («культуркампф»), колониальная и флотская политика; сначала свободная торговля, после 1879 года защитные пошлины.", "Национал-либеральная партия"],
      ["СДПГ(С)", -16, -6, "Историческая марксистская СДПГ Эрфуртской программы (1891): первая массовая рабочая партия, «государство в государстве» с профсоюзами и прессой; формально революционный марксизм, на практике реформизм, голосование за военные кредиты в 1914 году, участие в Веймарской коалиции. Буква (С) в подписи означает «старая» (довоенная СДПГ), в отличие от послевоенных СДПГ(Б) и СДПГ(Н).", "Социал-демократическая партия Германии (1890 - 1933)"],
      ["КПГ", -19, -17, "Партия спартаковцев (Люксембург, Либкнехт), созданная на рубеже 1918–1919 годов; с середины 1920-х сталинизируется под руководством Тельмана и работает как секция Коминтерна: диктатура пролетариата, советская власть, интернационализм, борьба с «социал-фашизмом» (так КПГ называла СДПГ).", "Коммунистическая партия Германии (1918 - 1933)"],
      ["НСДПГ", -18, -8, "Откололась от СДПГ в 1917 году из-за голосования за военные кредиты: антивоенное и интернационалистское крыло (Каутский, Бернштейн, Гаазе, Эйснер), социализация и власть советов; центр между реформистской СДПГ и революционной КПГ. В 1920 году большинство ушло в КПГ, остаток вернулся в СДПГ.", "Независимая социал-демократическая партия Германии (1917 - 1931)"],
      ["НСНРП(Г)", 5, -20, "Гитлеровское крыло национал-социализма: вождизм, расовый национализм и антисемитизм, ликвидация демократии, «народное сообщество», реваншизм и милитаризация, тоталитарный контроль над культурой, информацией и частной жизнью. «Социалистическая» риторика служила приманкой для электората, на практике экономика подчинялась государству и партии. Буква (Г) в подписи означает «гитлеровское» крыло партии, в отличие от штрассеровского НСНРП(Ш).", "Национал-социалистическая немецкая рабочая партия (1920 - 1945)"],
      ["НСНРП(Ш)", -2, -17, "Левое (штрассеровское) крыло национал-социализма — братья Грегор и Отто Штрассер: «социализм» как цель (национализация, антикапитализм, земельная реформа), конфликт с Гитлером на Бамбергской конференции (1926); Отто Штрассер ушёл из партии в 1930 году и создал «Чёрный фронт», Грегор оставался в НСДАП до отставки в 1932 году. Буква (Ш) в подписи означает «штрассеровское» крыло партии, в отличие от гитлеровского НСНРП(Г).", "Национал-социалистическая немецкая рабочая партия (штрассеровское крыло, 1925 - 1932)"],
      ["Чёрный Фронт", -2, -14, "Организация Отто Штрассера, оформившаяся после его ухода из НСДАП (1930): «немецкий социализм» — национализация земли и ключевых отраслей, сословное корпоративное устройство, федеративная Германия, нейтралитет между Западом и СССР, резкая критика Гитлера как «предателя революции»; упор на христианские и региональные ценности.", "Чёрный Фронт"],
      ["СПР", 10, -17, "Послевоенная неонацистская партия (Отто Эрнст Ремер, Фриц Дорлс), сильная в Нижней Саксонии и Бремене (до 11% на земельных выборах 1951 года); реабилитация вермахта, антизападность, нейтралистский «третий путь», этнонационализм; запрещена Федеральным конституционным судом в 1952 году как преемница НСДАП.", "Социалистическая партия Рейха (1949 - 1952)"],
      ["НННП", 18, -10, "Главная консервативно-националистическая партия Веймарской республики (ДНВП): монархисты, юнкеры, часть протестантского духовенства и крупной промышленности, пангерманцы. С 1928 года под руководством Гугенберга радикализуется; «Гарцбургский фронт» с НСДАП, в 1933 году входит в первый кабинет Гитлера. Реставрация монархии, ревизия Версаля, протекционизм, миф об «ударе в спину».", "Немецкая национальная народная партия (1918 - 1933)"],
      ["Центрум", 4, -5, "Партия политического католицизма: возникла как защита католиков в протестантской Пруссии во время «культуркампфа», опиралась на церковь, христианские профсоюзы и социальное католичество (Кеттелер). В Веймарской республике — опора «веймарской коалиции», дала нескольких канцлеров (Вирт, Маркс, Брюнинг); защита церковной школы, федерализм, умеренный реформизм.", "Германская партия Центра (1870 - 1933)"],
      ["ННП", 8, 2, "Партия Штреземана, преемница национал-либералов: крупная промышленность, образованная буржуазия, протестантский средний класс; сначала тяготела к монархии, затем стала «республиканской по разуму», дала канцлера и министра иностранных дел (Локарно, Лига Наций). После смерти Штреземана в 1929 году быстро сдвинулась вправо и к 1933 году исчезла.", "Немецкая народная партия (1918 - 1933)"],
      ["ГДП", -3, 3, "Левый либерализм Веймарской республики (Макс Вебер, Науман, Ратенау): республиканцы, участники «веймарской коалиции» с СДПГ и Центром, интеллигенция, свободные профессии и часть предпринимателей; секулярность, социальный либерализм. К 1930 году сильно ослабла и была переименована в Государственную партию.", "Германская демократическая партия (1918 - 1930)"],
      ["БНП", 10, -5, "Откололась от Центра в 1918 году из-за «красной» центральной политики Берлина: католический консерватизм, баварская автономия, антипрусский и антицентралистский настрой, монархические симпатии, защита села. Пыталась держаться против нацистов, самораспустилась в 1933 году; преемником считается ХСС.", "Баварская народная партия (1918 - 1933)"],
      ["НКП", 14, -10, "Партия прусского юнкерства, монархии и протестантской церкви: защита аграрных интересов (пошлины на зерно), сопротивление демократизации избирательного права в Пруссии, «Тиволийская программа» 1892 года с открытым антисемитизмом, милитаризм и империя.", "Немецкая консервативная партия (1876 - 1918)"],
      ["СкП", 11, -7, "Партия «бисмарковцев» (Рейхспартия): высшие чиновники, промышленники, офицеры и интеллигенция; поддерживала канцлера, защитные пошлины и колониальную политику, но была практичнее и либеральнее в экономике, чем юнкеры. Формально — Немецкая имперская и свободно-консервативная партия.", "Свободно-консервативная партия (1871 - 1918)"],
      ["НП", 9, -2, "Консервативная, национально-либеральная и федералистская партия послевоенной ФРГ (Нижняя Саксония, ганноверские «вельфы»), союзник Аденауэра в коалициях: рыночная экономика, антицентрализм, умеренный национализм; правое крыло «буржуазного лагеря», позже слилась с другими.", "Немецкая партия (1947 - 1961)"],
      ["СЕПГ", -13, -18, "Правящая партия ГДР: марксизм-ленинизм советского образца, плановая экономика, партийная монополия, Штази, цензура, закрытая граница. Создана слиянием КПГ и СДПГ в Восточной зоне.", "Социалистическая единая партия Германии (1946 - 1989)"],
      ["КДП(Л)", -6, 3, "Левое крыло кадетов (Некрасов, Кизеветтер, Кокошкин): социальный либерализм, сближение с социалистами (блок с эсерами и меньшевиками в 1917 году), принудительный выкуп помещичьей земли, сильное трудовое законодательство, республиканство после февраля. Буква (Л) в подписи означает «левое» крыло партии, в отличие от правого КДП(П).", "Конституционно-демократическая партия (левое крыло, 1905 - 1917)"],
      ["КДП(П)", 7, 5, "Правое крыло кадетов (Струве, Маклаков, Изгоев): национал-либерализм, идея «великой России» и имперской миссии, конституционная монархия и умеренный реформизм, ориентация на победу в войне и сохранение единства государства; меньше социального радикализма, больше легальной «буржуазной» оппозиции. Буква (П) в подписи означает «правое» крыло партии, в отличие от левого КДП(Л).", "Конституционно-демократическая партия (правое крыло, 1905 - 1917)"],
      ["Союз 17 октября", 7, -1, "Умеренные конституционалисты, сторонники манифеста 17 октября 1905 года (Гучков, Родзянко, Шварц): помещики, чиновники, купечество и дворянство; конституционная монархия, «единая и неделимая Россия», сотрудничество с властью и поддержка Столыпина, реформы только «сверху», сильная армия, частная собственность.", "Союз 17 октября (1905 - 1917)"],
      ["ПП", 0, 5, "Партия московских промышленников и либеральной буржуазии (Рябушинский, Коновалов, Ефремов), отделившаяся от октябристов и кадетов: парламентская монархия, реформы и «прогресс», защита предпринимательства, критика бюрократии и самодержавия. Ядро «Прогрессивного блока» 1915 года, участница Временного правительства.", "Прогрессивная партия (1912 - 1917)"],
      ["ПСР(П)", -10, -2, "Правое крыло эсеров (Брешко-Брешковская, Авксентьев, Савинков, во многом Керенский): оборончество и «война до победного конца», коалиция с кадетами во Временном правительстве, ставка на Учредительное собрание и «порядок» против большевиков; социализация земли сохраняется, но классовая борьба отходит на второй план. Буква (П) в подписи означает «правое» крыло ПСР, в отличие от центра ПСР(Ц), максималистов ПСР(М) и левых эсеров ПЛСР.", "Партия социалистов-революционеров (правое крыло, 1917 - 1922)"],
      ["ПСР(Ц)", -13, 1, "Центр эсеров (Чернов, Гоц, Зензинов): классический эсеровский курс — «земля и воля», социализация земли без выкупа, общинное крестьянское хозяйство, «трудовой принцип», федеративная демократическая республика и Учредительное собрание; главная партия 1917 года по числу голосов, историческая традиция индивидуального террора. Буква (Ц) в подписи означает «центр» ПСР, в отличие от правого крыла ПСР(П), максималистов ПСР(М) и левых эсеров ПЛСР.", "Партия социалистов-революционеров (центр, 1902 - 1922)"],
      ["ПСР(М)", -18, -4, "Максималисты (Союз социалистов-революционеров-максималистов): откололись от эсеров, требовали немедленного осуществления не только программы-минимум (землю), но и программы-максимум — «трудовой республики» и социализации фабрик; тактика — экспроприации и террор (взрыв на Аптекарском острове в 1906 году), позже часть максималистов перешла к большевикам. Буква (М) в подписи означает «максималисты», в отличие от правого крыла ПСР(П), центра ПСР(Ц) и левых эсеров ПЛСР.", "Партия социалистов-революционеров (максималисты, 1906 - 1924)"],
      ["ПЛСР", -17, -7, "Левые эсеры (Спиридонова, Камков, Натансон): революционный пафос и крестьянский радикализм, союз с большевиками в Советах, участие в Совнаркоме и ВЧК с конца 1917 года, выход из правительства из-за Брестского мира, «революционная война» и мятеж в июле 1918 года, после которого партия оказалась вне закона.", "Партия левых социалистов-революционеров (1917 - 1921)"],
      ["НСП", -8, 0, "«Энесы» (Пешехонов, Мякотин, Петрищев, Анненский): умеренные народники, отказ от классовой борьбы и революционного насилия, выкуп земли с вознаграждением, парламентская легальная борьба, демократическая республика; небольшая партия интеллигенции вокруг журнала «Русское богатство».", "Трудовая народно-социалистическая партия (1906 - 1917)"],
      ["РСДРП(М)", -15, -4, "Меньшевики (Мартов, Дан, Церетели, Плеханов, Потресов): ортодоксальный марксизм и ставка на широкое легальное рабочее движение, профсоюзы и парламентскую тактику; «буржуазная» революция должна предшествовать социалистической, захват власти «меньшинством» отвергался. В 1917 году участвовали во Временном правительстве и Советах, разделившись на оборонцев и интернационалистов (Мартов). Буква (М) в подписи означает «меньшевики», в отличие от большевиков РСДРП(Б).", "Российская социал-демократическая рабочая партия (меньшевики, 1903 - 1922)"],
      ["РСДРП(Б)", -19, -14, "Большевики (Ленин, Свердлов, Зиновьев, Каменев, Сталин): партия профессиональных революционеров и демократический централизм, диктатура пролетариата, курс на вооружённое восстание и мировую революцию. С апреля 1917 года лозунг «Вся власть Советам», в октябре захват власти, в марте 1918 года партия переименовалась в РКП(б). Буква (Б) в подписи означает «большевики», в отличие от меньшевиков РСДРП(М).", "Российская социал-демократическая рабочая партия (большевики, 1903 - 1918)"],
      ["ХДС(Б)", 9, -4, "Христианско-демократический союз боннской эпохи, от Аденауэра и Эрхарда до Коля: межконфессиональная партия католиков и протестантов, антикоммунизм и привязка к Западу, «социальное рыночное хозяйство», патерналистское государство всеобщего благосостояния (пенсионная реформа 1957 года), консервативная семейная и нравственная политика, долгое сопротивление восточной политике Брандта. При Коле — «духовно-моральный поворот» 1982 года и объединение Германии в 1990 году. Нынешняя ХДС (Н) заметно левее и либеральнее. Буква (Б) в подписи означает «боннская» (эпоха Боннской республики до 1998 года), в отличие от нынешней ХДС(Н).", "Христианско-демократический союз (1945 - 1998)"],
      ["СДПГ(Б)", -11, -5, "Социал-демократическая партия Германии боннской эпохи, от Шумахера до Лафонтена: после Годесбергской программы 1959 года отказ от марксизма и превращение в «народную партию», но с сильной рабочей и профсоюзной базой; при Брандте «больше демократии» и новая восточная политика, при Шмидте кейнсианство и расширение государства всеобщего благосостояния, соучастие рабочих в управлении предприятиями. Нынешняя СДПГ (Н) после «Повестки 2010» стала рыночнее и умереннее. Буква (Б) в подписи означает «боннская» (эпоха Боннской республики до 1998 года); есть также СДПГ(С) «старая» до 1933 года и СДПГ(Н) нынешняя.", "Социал-демократическая партия Германии (1945 - 1998)"],
      ["Демократическая партия (П)", -11, -9, "Прогрессивное крыло демократов (Сандерс, Уоррен, Окасио-Кортес, «Отряд» и Конгрессиональный прогрессивный кокус): всеобщая государственная медицина, «Зелёный новый курс», высокие налоги на богатых и корпорации, борьба с монополиями, сильные профсоюзы, бесплатное образование. Левая риторика при сохранении работы внутри демократических институтов. Буква (П) в подписи означает «прогрессисты», в отличие от истеблишмента (И) и «синих псов» (С).", "Демократическая партия (прогрессисты)"],

  function fitLabel(g) {
    var t = g.getElementsByTagName('text')[0], r = g.getElementsByTagName('rect')[0];
    if (!t || !r) return;
    var baseX = parseFloat(g.getAttribute('data-x'));
    t.setAttribute('x', baseX);
    var bb = t.getBBox(), padX = 8, padY = 4;
    var vb = document.getElementById('compass').viewBox.baseVal;
    var minX = vb.x + 4, maxX = vb.x + vb.width - 4;
    var left = bb.x - padX, right = bb.x + bb.width + padX, dx = 0;
    if (left < minX) { dx = minX - left; } else if (right > maxX) { dx = maxX - right; }
    t.setAttribute('x', baseX + dx);
    r.setAttribute('x', left + dx);
    r.setAttribute('y', bb.y - padY);
    r.setAttribute('width', right - left);
    r.setAttribute('height', bb.height + 2 * padY);
  }

    }
    document.getElementById('presetMenu').innerHTML = html;
  }
  function togglePresetMenu(e) {
    if (e) e.stopPropagation();
    var m = document.getElementById('presetMenu');
    if (m.classList.contains('open')) { m.classList.remove('open'); return; }
    buildPresetMenu(); m.classList.add('open');
  }
  function choosePreset(id) {
    presetSel[currentLayer] = id;
    var items = document.querySelectorAll('#presetMenu .pr-item');
    for (var q = 0; q < items.length; q++) {
      items[q].classList.toggle('active', items[q].getAttribute('data-id') === id);
    }
    refreshLayer();
  }
  function updatePresetUI() {
    document.getElementById('presetBtn').style.display = eggMode ? 'none' : 'flex';
    if (eggMode) document.getElementById('presetMenu').classList.remove('open');
  }
  document.addEventListener('click', function(e) {
    var m = document.getElementById('presetMenu');
    if (m && !m.contains(e.target)) m.classList.remove('open');
  });

  function unitToPx(v) {
    // v in [-20, 20] -> px in [80, 640]
    return 360 + v * 14;
  }

  function render(layer, animate) {
    var g = document.getElementById('points');
    var data = layers[layer] || [];
    var html = '';
    for (var i = 0; i < data.length; i++) {
      if (!inPreset(layer, data[i][0])) continue;
      var name = data[i][0], x = unitToPx(data[i][1]), y = unitToPx(data[i][2]), desc = data[i][3] || '', cardTitle = data[i][4] || name;
      var labelId = 'lbl-' + layer + '-' + i;
      var escTitle = cardTitle.replace(/'/g, "\\'");
      var escDesc = desc.replace(/'/g, "\\'").replace(/\n/g, '\\n');
      html += '<circle class="pt" cx="' + x + '" cy="' + y + '" r="5" fill="#8B3A2F" stroke="#EDE6D6" stroke-width="1" style="cursor:pointer;" onclick="pointClick(\'' + labelId + '\', \'' + escTitle + '\', \'' + escDesc + '\')"></circle>';
      html += '<g id="' + labelId + '" class="lbl" data-x="' + x + '" style="display:none; pointer-events:none; filter: drop-shadow(0 2px 4px rgba(43,38,32,0.28));">' +
              '<rect fill="#e2d9c4" stroke="#8B3A2F" stroke-width="1" rx="5" ry="5"></rect>' +
              '<text x="' + x + '" y="' + (y - 14) + '" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2B2620">' + name + '</text></g>';
    }
    g.innerHTML = html;
    if (animate) {
      var cs = g.querySelectorAll('circle.pt');
      for (var k = 0; k < cs.length; k++) { cs[k].style.transform = 'scale(0.2)'; }
      void g.getBoundingClientRect();
      for (var k2 = 0; k2 < cs.length; k2++) { cs[k2].style.transform = 'scale(1)'; }
    }
  }

  function showLabelEl(el) {
    el.classList.remove('lbl-in');
    el.style.display = 'block';
    if (el.parentNode) { el.parentNode.appendChild(el); }
    fitLabel(el);
    void el.getBoundingClientRect();
    el.classList.add('lbl-in');
  }

  function hideLabelEl(el) {
    el.style.display = 'none';
    el.classList.remove('lbl-in');
  }

  var openLabelId = null;
  var infoEnabled = true;
  var currentLayer = 'ideo';
  var eggMode = false;
  function dk() { return (eggMode ? 'egg_' : '') + currentLayer; }

  function onSearchInput() {
    var q = document.getElementById('searchInput').value.trim().toLowerCase();
    var box = document.getElementById('searchResults');
    if (!q) { box.style.display = 'none'; box.innerHTML = ''; return; }
    var data = layers[dk()] || [];
    var matches = [];
    for (var i = 0; i < data.length; i++) {
      if (inPreset(dk(), data[i][0]) && data[i][0].toLowerCase().indexOf(q) !== -1) matches.push(i);
    }
    if (matches.length === 0) {
      box.innerHTML = '<div class="res-empty">Ничего не найдено</div>';
    } else {
      var html = '';
      for (var j = 0; j < matches.length; j++) {
        var idx = matches[j];
        html += '<div class="res-item" onclick="selectSearchResult(' + idx + ')">' + data[idx][0] + '</div>';
      }
      box.innerHTML = html;
    }
    box.style.display = 'block';
  }

  function selectSearchResult(index) {
    var data = layers[dk()][index];
    if (!data) return;
    var labelId = 'lbl-' + dk() + '-' + index;
    var el = document.getElementById(labelId);
    if (el) {
      showLabelEl(el);
      openLabelId = labelId;
    }
    var cardTitle = data[4] || data[0];
    var desc = data[3] || '';
    if (infoEnabled && desc) {
      showInfo(cardTitle, desc);
    }
    document.getElementById('searchResults').style.display = 'none';
    document.getElementById('searchInput').value = '';
  }

  document.addEventListener('click', function(e) {
    var wrap = document.getElementById('searchWrap');
    if (wrap && !wrap.contains(e.target)) {
      document.getElementById('searchResults').style.display = 'none';
    }
  });

  function pointClick(labelId, name, desc) {
    var nowVisible = toggleLabel(labelId);
    if (nowVisible) {
      openLabelId = labelId;
      if (infoEnabled && desc) {
        showInfo(name, desc);
      }
    } else {
      if (openLabelId === labelId) { openLabelId = null; }
      closeInfo();
    }
  }

  function toggleLabel(id) {
    var el = document.getElementById(id);
    if (el) {
      var isHidden = (el.style.display === 'none' || el.style.display === '');
      if (isHidden) { showLabelEl(el); } else { hideLabelEl(el); }
      return isHidden;
    }
    return false;
  }

  function showInfo(name, desc) {
    document.getElementById('infoTitle').textContent = name;
    document.getElementById('infoDesc').textContent = desc;
    document.getElementById('infoPanel').style.display = 'block';
  }

  function closeInfo() {
    document.getElementById('infoPanel').style.display = 'none';
    if (openLabelId) {
      var el = document.getElementById(openLabelId);
      if (el) { hideLabelEl(el); }
      openLabelId = null;
    }
  }

  function closeAll() {
    var labels = document.querySelectorAll('#points .lbl');
    for (var i = 0; i < labels.length; i++) {
      hideLabelEl(labels[i]);
    }
    openLabelId = null;
    document.getElementById('infoPanel').style.display = 'none';
  }

  function toggleInfoEnabled() {
    infoEnabled = !infoEnabled;
    var knob = document.getElementById('infoKnob');
    var sw = document.getElementById('infoSwitch');
    if (infoEnabled) {
      knob.style.left = '23px';
      sw.style.background = '#8B3A2F';
    } else {
      knob.style.left = '3px';
      sw.style.background = '#b8ab90';
      document.getElementById('infoPanel').style.display = 'none';
    }
  }

  var settingsTimer = null;
  function openSettings() {
    var ov = document.getElementById('settingsOverlay');
    clearTimeout(settingsTimer);
    ov.classList.remove('closing', 'open');
    ov.style.display = 'flex';
    void ov.offsetWidth;
    ov.classList.add('open');
  }

  function closeSettings() {
    var ov = document.getElementById('settingsOverlay');
    if (ov.style.display !== 'flex' || ov.classList.contains('closing')) return;
    ov.classList.remove('open');
    ov.classList.add('closing');
    clearTimeout(settingsTimer);
    settingsTimer = setTimeout(function() {
      ov.style.display = 'none';
      ov.classList.remove('closing');
    }, 190);
  }

  function updateToggleUI(layer) {
    var ids = { ideo: 'btn-ideo', real: 'btn-real' };
    var pill = document.getElementById('tglPill');
    for (var key in ids) {
      var b = document.getElementById(ids[key]);
      if (key === layer) {
        b.classList.add('active');
        pill.style.width = b.offsetWidth + 'px';
        pill.style.transform = 'translateX(' + b.offsetLeft + 'px)';
      } else {
        b.classList.remove('active');
      }
    }
  }

  var layerTimer = null;
  function setLayer(layer) {
    if (layer === currentLayer) return;
    updateToggleUI(layer);
    currentLayer = layer;
    refreshLayer();
  }

  function toggleEgg() {
    eggMode = !eggMode;
    document.getElementById('eggKnob').style.left = eggMode ? '23px' : '3px';
    document.getElementById('eggSwitch').style.background = eggMode ? '#8B3A2F' : '#b8ab90';
    refreshLayer();
  }

  function refreshLayer() {
    updatePresetUI();
    document.getElementById('presetMenu').classList.remove('open');
    openLabelId = null;
    closeInfo();
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').style.display = 'none';
    var g = document.getElementById('points');
    g.style.pointerEvents = 'none';
    g.style.opacity = '0';
    clearTimeout(layerTimer);
    layerTimer = setTimeout(function() {
      render(dk(), true);
      g.style.opacity = '1';
      g.style.pointerEvents = '';
    }, 200);
  }

  var ctrlAlone = false;
  document.addEventListener('keyup', function(e) {
    if (e.key === 'Control' && ctrlAlone) {
      setLayer(currentLayer === 'ideo' ? 'real' : 'ideo');
    }
    if (e.key === 'Control') { ctrlAlone = false; }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Control') {
      ctrlAlone = !e.repeat ? true : ctrlAlone;
      return;
    }
    ctrlAlone = false;
    if (e.key === 'Tab') {
      var inp = document.getElementById('searchInput');
      e.preventDefault();
      if (document.activeElement === inp) { inp.blur(); } else { inp.focus(); }
      return;
    }
    if (e.code === 'Backquote' || e.key === 'ё' || e.key === 'Ё') {
      var ae = document.activeElement;
      if (!(ae && ae.id === 'searchInput') && !eggMode) { togglePresetMenu(null); }
      e.preventDefault();
      return;
    }
    if (e.key === 'Escape') {
      var ov = document.getElementById('settingsOverlay');
      var isOpen = ov.style.display === 'flex' && !ov.classList.contains('closing');
      if (isOpen) { closeSettings(); } else { openSettings(); }
      e.preventDefault();
    } else if (e.key === 'Shift' && !e.repeat) {
      var a = document.activeElement;
      if (a && a.id === 'searchInput') return;
      closeAll();
    }
  });

  render('ideo');
  updateToggleUI('ideo');
  (function() {
    var pill = document.getElementById('tglPill');
    requestAnimationFrame(function() { requestAnimationFrame(function() { pill.classList.add('ready'); }); });
    window.addEventListener('load', function() { updateToggleUI(currentLayer); });
    window.addEventListener('resize', function() { updateToggleUI(currentLayer); });
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function() { updateToggleUI(currentLayer); }); }
  })();
</script>
</body>
</html>
